# 本地开发用 patch overlay：
#   npm run build
#   dsh web --patch /absolute/path/to/dsh-plugin-bili-fish/cordis.patch.yml
# 插件路径必须是绝对路径。把下面的 /ABSOLUTE/PATH 换成本仓库所在目录。

# 1) bilibili-mcp-server（npm: bilibili-mcp-server，github.com/Iseenope/bilibili-mcp-server）
#    经官方桥 @deepseek-ai/dsh-mcp-client 接入，工具以 mcp__bilibili__bilibili_* 出现在 ctx.tools。
#    登录信息在设置页「B 站登录」里填写，保存到 ~/.dsh/bili-fish/cookie.json（仅当前用户可读），
#    这里只把文件路径交给它。不要再在 env 里写 BILIBILI_SESSDATA 等三项：环境变量会覆盖文件。
#    保存或修改登录信息后需要重启 DSH。
- insert:
    - id: mcp-bilibili
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: bilibili
        transport: stdio
        command: npx
        args: ['-y', 'bilibili-mcp-server@1.2.0']
        env:
          BILIBILI_COOKIE_FILE: '/root/.dsh/bili-fish/cookie.json'   # 换成设置页里显示的路径

# 2) 本插件（指向源码构建产物 lib/index.js）。
- insert:
    - id: bili-fish
      name: '/ABSOLUTE/PATH/dsh-plugin-bili-fish/lib/index.js'
      config:
        sendEnabled: false          # 总开关，先保持关闭，只看草稿
        dryRunByDefault: true
        maxCommentsPerDay: 5
        maxRepliesPerDay: 10
        minIntervalMs: 12000
        voiceEnabled: true
        bilibili:
          replyTool: mcp__bilibili__bilibili_reply
          voiceTool: ''             # bilibili-mcp-server 没有语音评论工具，留空
        tts:
          service: tts              # dsh-plugin-tts 提供的 ctx 服务名
          defaultVoice: zh-CN-XiaoxiaoNeural
        voiceFallback:
          enabled: false            # 降级路径默认关闭
